name: Catálogo completo BYPSSD en GitHub
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Identificador inmutable del catálogo
        default: '20261115'
        required: true
      resume_run:
        description: Reanudar el inventario inmutable de un run anterior (opcional)
        required: false
        default: ''
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mirror-catalog
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Recuperar inventario inmutable si se reanuda
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          gh run download "$RESUME_RUN" --name catalog-plan --dir imported-plan
          mkdir -p out/catalog
          cp -r imported-plan/out/catalog/* out/catalog/
          cp imported-plan/catalog-inventory.json .
          gh run download "$RESUME_RUN" --name catalog-chunks --dir out/catalog
      - name: Verificar el generador de metadatos
        run: python3 -m unittest discover -s tests -p 'test_mirror_catalog.py'
      - id: plan
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          if [ -z "$RESUME_RUN" ]; then
            python3 scripts/mirror-catalog.py inventory --snapshot "$SNAPSHOT" > catalog-inventory.json
          else
            python3 -c 'import json,os; p=json.load(open("out/catalog/plan.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("chunks="+json.dumps(p["chunks"])+"\n")'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-plan
          path: |
            out/catalog/plan.json
            out/catalog/metadata/
            catalog-inventory.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-chunks
          path: out/catalog/chunk-*.json
          retention-days: 30
  packages:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.inventory.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog-chunks
          path: out/catalog
      - name: Verificar y publicar lote de hasta 900 RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror-catalog.py upload --chunk '${{ matrix.chunk }}'
  metadata:
    environment:
      name: github-pages
    needs: [inventory, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog-plan
          path: plan-download
      - run: |
          mkdir -p out/catalog
          cp -r plan-download/out/catalog/* out/catalog/
      - uses: actions/download-artifact@v4
        with:
          name: catalog-chunks
          path: out/catalog
      - name: Comprobar cada asset y generar repositorios BYPSSD
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror-catalog.py finalize
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
