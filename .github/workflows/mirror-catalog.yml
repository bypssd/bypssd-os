name: Catálogo completo BYPSSD en GitHub
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Identificador inmutable del catálogo
        default: '20261115'
        required: true
      resume_run:
        description: Reanudar el inventario inmutable de un run anterior (opcional)
        required: false
        default: ''
      batch:
        description: Tanda reanudable de dos releases (se avanza automáticamente)
        default: '0'
        required: true
      attempt:
        description: Reintento automático de la tanda
        default: '0'
        required: true
permissions:
  actions: write
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mirror-catalog
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has_more: ${{ steps.plan.outputs.has_more }}
      next_batch: ${{ steps.plan.outputs.next_batch }}
      plan_run: ${{ steps.plan.outputs.plan_run }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Recuperar inventario inmutable si se reanuda
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          gh run download "$RESUME_RUN" --name catalog-plan --dir imported-plan
          mkdir -p out/catalog
          cp -r imported-plan/out/catalog/* out/catalog/
          cp imported-plan/catalog-inventory.json .
          gh run download "$RESUME_RUN" --name catalog-chunks --dir out/catalog
      - name: Verificar el generador de metadatos
        run: python3 -m unittest discover -s tests -p 'test_mirror_catalog.py'
      - id: plan
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
          RESUME_RUN: ${{ inputs.resume_run }}
          BATCH: ${{ inputs.batch }}
        run: |
          if [ -z "$RESUME_RUN" ]; then
            python3 scripts/mirror-catalog.py inventory --snapshot "$SNAPSHOT" > catalog-inventory.json
          fi
          python3 - <<'PYCODE'
          import json,os
          p=json.load(open('out/catalog/plan.json')); n=int(os.environ['BATCH']); chunks=p['chunks'][n*2:(n+1)*2]
          if not chunks:raise SystemExit('Invalid batch index')
          outputs={'chunks':json.dumps(chunks),'has_more':str((n+1)*2<len(p['chunks'])).lower(),'next_batch':str(n+1),'plan_run':os.environ['RESUME_RUN'] or os.environ['GITHUB_RUN_ID']}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
           for k,v in outputs.items():f.write(k+'='+v+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-plan
          path: |
            out/catalog/plan.json
            out/catalog/metadata/
            catalog-inventory.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-chunks
          path: out/catalog/chunk-*.json
          retention-days: 30
  packages:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: ${{ fromJSON(needs.inventory.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog-chunks
          path: out/catalog
      - name: Verificar y publicar lote de hasta 900 RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror-catalog.py upload --chunk '${{ matrix.chunk }}'
  continue:
    needs: [inventory, packages]
    if: needs.inventory.outputs.has_more == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Continuar con la siguiente tanda inmutable
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN: ${{ needs.inventory.outputs.plan_run }}
          NEXT_BATCH: ${{ needs.inventory.outputs.next_batch }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: gh workflow run mirror-catalog.yml --repo "$GITHUB_REPOSITORY" -f snapshot="$SNAPSHOT" -f resume_run="$PLAN_RUN" -f batch="$NEXT_BATCH" -f attempt=0
  retry:
    needs: [inventory, packages]
    if: always() && needs.inventory.result == 'success' && needs.packages.result == 'failure' && fromJSON(inputs.attempt) < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Reanudar archivos pendientes tras un error de transferencia
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN: ${{ needs.inventory.outputs.plan_run }}
          BATCH: ${{ inputs.batch }}
          ATTEMPT: ${{ inputs.attempt }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: gh workflow run mirror-catalog.yml --repo "$GITHUB_REPOSITORY" -f snapshot="$SNAPSHOT" -f resume_run="$PLAN_RUN" -f batch="$BATCH" -f attempt="$((ATTEMPT+1))"
  metadata:
    if: needs.inventory.outputs.has_more == 'false'
    environment:
      name: github-pages
    needs: [inventory, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog-plan
          path: plan-download
      - run: |
          mkdir -p out/catalog
          cp -r plan-download/out/catalog/* out/catalog/
      - uses: actions/download-artifact@v4
        with:
          name: catalog-chunks
          path: out/catalog
      - name: Comprobar cada asset y generar repositorios BYPSSD
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror-catalog.py finalize
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
