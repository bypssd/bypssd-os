name: NextWindow Fedora 45 x64 tres kernels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e instalar en Fedora 45 x64
        run: |
          set -o pipefail
          mkdir -p out/fedora45/delivery
          docker run --rm -v "$PWD:/workspace" -w /workspace fedora:45 bash scripts/fedora/build-nextwindow.sh 2>&1 | tee out/fedora45/delivery/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextwindow-fedora45-x86_64
          path: out/fedora45/delivery/
          retention-days: 30
