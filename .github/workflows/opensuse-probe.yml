name: Verificar base openSUSE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar herramientas y paquetes nativos
        run: |
          docker run --rm opensuse/tumbleweed bash -exc '
            zypper --non-interactive refresh
            zypper search -s kiwi
            zypper --non-interactive install python3-kiwi createrepo_c rpm-build
            zypper search -s --match-exact calamares discover6 discover6-backend-packagekit PackageKit-backend-zypp appstream-glib AppStream plasma6-desktop plasma6-session-wayland patterns-kde-kde_plasma branding-upstream openSUSE-release
            kiwi-ng --version
          '
