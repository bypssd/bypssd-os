name: Construir BYPSSD sobre openSUSE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar runner aislado
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo modprobe loop
          df -h .
      - name: Construir ISO nativa con paquetes openSUSE
        run: |
          set -o pipefail
          mkdir -p out/logs
          docker run --name bypssd-opensuse --privileged -v "$PWD:/workspace" -w /workspace opensuse/tumbleweed bash scripts/opensuse/build.sh 2>&1 | tee out/logs/opensuse-build-console.log
      - name: Guardar ISO y RPM antes de publicar
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-delivery-${{ matrix.arch }}
          compression-level: 0
          retention-days: 1
          path: |
            out/BYPSSD-OS-Renacer-1.1-*.iso*
            out/opensuse/rpms/*.rpm
            out/opensuse/srpms/*.rpm
            out/package-manifest-opensuse-*.txt
            out/audit-opensuse-*.json
      - name: Publicar solo paquetes BYPSSD y fuentes
        run: |
          for attempt in $(seq 1 60); do
            remaining=$(gh api rate_limit --jq .resources.core.remaining)
            [ "$remaining" -gt 30 ] && break
            echo "Esperando cuota de publicación GitHub; los archivos ya están guardados como artefactos."
            sleep 60
          done
          python3 scripts/opensuse/publish-packages.py out "$ARCH" --tag renacer-1.1-opensuse-r15
      - name: Conservar logs completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-logs-${{ matrix.arch }}
          path: |
            out/logs/
            out/*opensuse*.json
            out/opensuse/result/*.log
          retention-days: 30
