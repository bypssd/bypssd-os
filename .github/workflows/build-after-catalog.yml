name: ISO con repositorio exclusivo BYPSSD
on:
  workflow_run:
    workflows: ['Catálogo completo BYPSSD en GitHub']
    types: [completed]
permissions:
  contents: write
jobs:
  ready:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PYCODE'
          import json,os,time,urllib.request
          ready=False
          for attempt in range(12):
           try:
            with urllib.request.urlopen('https://bypssd.github.io/bypssd-os/catalog-summary.json?run='+os.environ['SOURCE_RUN'],timeout=30) as r:p=json.load(r)
            ready=p.get('status')=='complete' and str(p.get('publication_run'))==os.environ['SOURCE_RUN']
           except Exception:pass
           if ready:break
           time.sleep(10)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(ready).lower()+'\n')
          PYCODE
  build:
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    uses: ./.github/workflows/build-iso.yml
    with:
      architecture: ${{ matrix.architecture }}
    secrets: inherit
