name: Construir ISO BYPSSD
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Arquitectura nativa
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ inputs.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Espacio para la compilación aislada
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h .
      - name: Construir RPM e ISO en Fedora nativa
        run: |
          docker run --rm --privileged -v "$PWD:/workspace" -w /workspace \
            registry.fedoraproject.org/fedora:45 bash scripts/ci-build.sh
      - name: Publicar las dos colecciones de archivos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view renacer-1.0-r6 >/dev/null 2>&1 || gh release create renacer-1.0-r6 --prerelease --title 'BYPSSD OS Renacer 1.0 · revisión 6' --notes-file docs/release-r5.md
          gh release upload renacer-1.0-r6 out/*.iso out/*.iso.sha256 out/package-manifest-*.txt out/branding-audit-*.json
          gh release view packages-1.0-6-${{ inputs.architecture }} >/dev/null 2>&1 || gh release create packages-1.0-6-${{ inputs.architecture }} --prerelease --title 'BYPSSD OS · Paquetes ${{ inputs.architecture }}' --notes-file docs/packages-r5.md
          gh release upload packages-1.0-6-${{ inputs.architecture }} out/common-packages/${{ inputs.architecture }}/*.rpm out/srpms/*.src.rpm
      - name: Conservar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.architecture }}
          path: |
            out/logs/
            out/*manifest*.txt
            out/branding-audit-*.json
          retention-days: 14
