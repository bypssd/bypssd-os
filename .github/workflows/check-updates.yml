name: Validar BYPSSD Updates con ZYpp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Refrescar el repositorio vacío con la configuración real
        run: |
          docker run --rm -v "$PWD:/workspace:ro" opensuse/tumbleweed bash -exc '
            mkdir /tmp/bypssd-repos
            cp /workspace/opensuse/bypssd-updates.repo /tmp/bypssd-repos/
            zypper --non-interactive --reposd-dir /tmp/bypssd-repos refresh
            zypper --reposd-dir /tmp/bypssd-repos repos --uri
          '
