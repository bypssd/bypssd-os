name: NextWindow experimental x64
on:
  workflow_dispatch:
    inputs:
      target:
        description: Kernel objetivo
        type: choice
        options: [latest, live-r16]
        default: latest
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXTWINDOW_TARGET: ${{ inputs.target || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y comprobar módulo y decodificadores en Tumbleweed
        run: |
          set -o pipefail
          mkdir -p out/nextwindow
          docker run --rm -e NEXTWINDOW_TARGET -v "$PWD:/workspace" -w /workspace opensuse/tumbleweed bash scripts/opensuse/build-nextwindow.sh 2>&1 | tee out/nextwindow/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bypssd-nextwindow-x86_64
          path: out/nextwindow/
          retention-days: 30
