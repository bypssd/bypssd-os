---
modules-search: [ local ]
instances:
  - id: bypssd-cleanup
    module: shellprocess
    config: shellprocess-bypssd-cleanup.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@bypssd-cleanup
      - dracut
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished
branding: bypssd
prompt-install: false
dont-chroot: false
