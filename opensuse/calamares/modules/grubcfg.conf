---
# Build installed boot parameters from Calamares' target metadata, not the Live OS.
overwrite: true
prefer_grub_d: false
keep_distributor: false
kernel_params: [ quiet ]
defaults:
  GRUB_DEFAULT: '0'
  GRUB_TIMEOUT: 5
  GRUB_DISABLE_SUBMENU: false
  GRUB_DISABLE_RECOVERY: false
  GRUB_CMDLINE_LINUX: ''
  GRUB_TERMINAL_OUTPUT: gfxterm
  GRUB_GFXMODE: auto
  GRUB_FONT: /boot/grub2/fonts/unicode.pf2
  GRUB_THEME: /usr/share/grub2/themes/bypssd/theme.txt
