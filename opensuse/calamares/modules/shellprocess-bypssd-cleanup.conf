---
dontChroot: false
timeout: 120
script:
  - "rm -f /etc/sddm.conf.d/10-bypssd-live.conf /etc/dracut.conf.d/02-livecd.conf"
  - "systemctl disable bypssd-live.service || true"
  - "rm -f /etc/systemd/system/bypssd-live.service /usr/share/applications/bypssd-install.desktop /etc/skel/Desktop/bypssd-install.desktop /home/*/Desktop/bypssd-install.desktop /root/Desktop/bypssd-install.desktop"
  - "systemctl enable NetworkManager display-manager-legacy.service"
