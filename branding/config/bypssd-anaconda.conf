[Profile]
profile_id = bypssd

[Profile Detection]
os_id = bypssd

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1

[User Interface]
custom_stylesheet = /usr/share/bypssd/anaconda.css
webui_web_engine = firefox

[Payload]
default_source = CLOSEST_MIRROR
default_rpm_gpg_keys =
    /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-45-aarch64
updates_repositories = bypssd-updates
